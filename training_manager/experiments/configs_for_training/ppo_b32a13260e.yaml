behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 1536
      learning_rate: 0.0004040289791852538
      beta: 0.001192006532668199
      epsilon: 0.28165242357844855
      lambd: 0.9199119185083499
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
