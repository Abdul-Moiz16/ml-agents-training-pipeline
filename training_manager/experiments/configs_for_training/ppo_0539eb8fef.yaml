behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 4096
      learning_rate: 0.00035762249909646537
      beta: 0.0034356547232375005
      epsilon: 0.12357506056502668
      lambd: 0.9105934026364145
