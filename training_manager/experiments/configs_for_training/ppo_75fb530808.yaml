behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 32
      buffer_size: 960
      learning_rate: 0.0002892578003730344
      beta: 0.006293863005392416
      epsilon: 0.24794444035874538
      lambd: 0.9172309068533224
      num_epoch: 5
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 128
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.8117488282764709
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000
