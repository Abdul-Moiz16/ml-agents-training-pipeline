behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 3456
      learning_rate: 0.0007502969071326109
      beta: 0.008993626873641082
      epsilon: 0.27567612061494984
      lambd: 0.9235399858102689
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 256
      num_layers: 1
