behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 2304
      learning_rate: 0.0006030857739947037
      beta: 0.0016457834369574165
      epsilon: 0.11823817843248041
      lambd: 0.910779234420749
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 128
      num_layers: 1
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.8107593089426972
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 10000
