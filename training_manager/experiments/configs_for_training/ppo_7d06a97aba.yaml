behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 6656
      learning_rate: 0.0006047457831487297
      beta: 0.0021654556399819886
      epsilon: 0.10338945802965299
      lambd: 0.9426013987090502
      num_epoch: 5
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 64
      num_layers: 1
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.9255784172749535
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000
