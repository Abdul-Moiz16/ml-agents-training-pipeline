behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 32
      buffer_size: 480
      learning_rate: 0.0008008265955898518
      beta: 0.0023470568844067177
      epsilon: 0.11328299218464
      lambd: 0.923530305255853
      num_epoch: 5
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 128
      num_layers: 1
