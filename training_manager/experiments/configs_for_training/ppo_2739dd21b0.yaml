behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 2304
      learning_rate: 0.0005698886910644835
      beta: 0.008918852430687123
      epsilon: 0.21942809664832402
      lambd: 0.9166057047848113
