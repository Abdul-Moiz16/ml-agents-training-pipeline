behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 32
      buffer_size: 1216
      learning_rate: 0.0005699513608453758
      beta: 0.00783523707506128
      epsilon: 0.27934852881925765
      lambd: 0.9228479967325338
