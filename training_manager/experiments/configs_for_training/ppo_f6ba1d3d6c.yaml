behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 9216
      learning_rate: 0.00033575309626423914
      beta: 0.003814193681755029
      epsilon: 0.17072507519516594
      lambd: 0.9233308799728736
