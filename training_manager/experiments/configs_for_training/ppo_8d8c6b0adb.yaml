behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 2304
      learning_rate: 0.00012475037776106432
      beta: 0.004243798787479794
      epsilon: 0.2982177021297284
      lambd: 0.9329884104920989
