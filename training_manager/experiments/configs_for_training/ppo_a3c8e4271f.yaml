behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 2560
      learning_rate: 0.00016034176144855388
      beta: 0.004218477007698636
      epsilon: 0.20614896846143949
      lambd: 0.9439414633919495
      num_epoch: 4
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.8550777925143411
