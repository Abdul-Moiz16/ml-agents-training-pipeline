behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 32
      buffer_size: 896
      learning_rate: 0.0003706030075861153
      beta: 0.0011583392868162895
      epsilon: 0.14142697934771653
      lambd: 0.9107908991379555
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 128
      num_layers: 1
