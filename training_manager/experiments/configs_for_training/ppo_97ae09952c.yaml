behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 32
      buffer_size: 1024
      learning_rate: 0.0009285501875520046
      beta: 0.0049195753345918705
      epsilon: 0.17031062727557642
      lambd: 0.9368544831588439
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.9711642565750025
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 10000
