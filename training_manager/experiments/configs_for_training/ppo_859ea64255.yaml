behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 1856
      learning_rate: 4.224520661143833e-05
      beta: 0.006633316046991535
      epsilon: 0.2960925647648167
      lambd: 0.9083222835175635
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.8685085429023185
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000
