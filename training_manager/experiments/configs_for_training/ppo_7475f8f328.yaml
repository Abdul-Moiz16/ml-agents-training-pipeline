behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 8192
      learning_rate: 0.0005350181997027027
      beta: 0.005463011618935589
      epsilon: 0.17177547037103086
      lambd: 0.9147271550371645
      num_epoch: 4
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.8701108392692585
