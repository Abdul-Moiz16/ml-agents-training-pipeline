behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 3712
      learning_rate: 0.00015760520255750246
      beta: 0.0036470293408024114
      epsilon: 0.13262689082591433
      lambd: 0.9103845356522814
      num_epoch: 4
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.9224994968919533
