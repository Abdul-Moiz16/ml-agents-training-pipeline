behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 2560
      learning_rate: 0.0009430197709547642
      beta: 0.00677416200799578
      epsilon: 0.23056832460915935
      lambd: 0.922461309599939
