behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 960
      learning_rate: 0.0006246523034081362
      beta: 0.00766182068528186
      epsilon: 0.2969583959912453
      lambd: 0.9446076520121075
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 256
      num_layers: 1
