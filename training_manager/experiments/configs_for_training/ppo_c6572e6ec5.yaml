behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 32
      buffer_size: 1088
      learning_rate: 0.00016524495690010456
      beta: 0.0065744841444946725
      epsilon: 0.10996176110023943
      lambd: 0.9004880240101516
