behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 2816
      learning_rate: 0.0002050241324102462
      beta: 0.009751287645595963
      epsilon: 0.11488740448659746
      lambd: 0.9217518575242534
      num_epoch: 4
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 64
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.9653212433026445
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000
