behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 2560
      learning_rate: 0.000745397974188212
      beta: 0.00737994756390096
      epsilon: 0.24880079385017487
      lambd: 0.9250751875581376
      num_epoch: 5
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 64
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.9171437720768197
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 64
    summary_freq: 10000
