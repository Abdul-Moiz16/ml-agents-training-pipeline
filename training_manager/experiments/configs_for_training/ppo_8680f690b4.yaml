behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 32
      buffer_size: 1280
      learning_rate: 0.0009026959771069473
      beta: 0.006667537394106109
      epsilon: 0.16105449449631942
      lambd: 0.9191770898089237
      num_epoch: 5
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.9585324660645668
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000
