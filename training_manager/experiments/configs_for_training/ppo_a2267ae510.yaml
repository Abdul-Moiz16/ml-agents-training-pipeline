behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 8448
      learning_rate: 0.0009537479330216829
      beta: 0.009199370912310456
      epsilon: 0.2565581760644794
      lambd: 0.9404326590441993
      num_epoch: 4
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.8576070663987276
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000
