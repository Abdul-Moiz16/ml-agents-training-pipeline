behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 8704
      learning_rate: 0.000788602951966721
      beta: 0.006993551612008722
      epsilon: 0.1842248290074071
