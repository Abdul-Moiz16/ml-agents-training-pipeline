behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 2560
      learning_rate: 0.000967430293253004
      beta: 0.0060262384515037525
      epsilon: 0.16302774713805848
      lambd: 0.907049865655303
      num_epoch: 3
