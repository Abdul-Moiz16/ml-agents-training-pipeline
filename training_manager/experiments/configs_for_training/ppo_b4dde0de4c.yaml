behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 2048
      learning_rate: 0.0005581280927563458
      beta: 0.004313951394824918
      epsilon: 0.17169348546842997
      lambd: 0.938145533227613
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 64
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.8857711139606098
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 10000
