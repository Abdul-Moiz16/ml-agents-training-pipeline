behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 2816
      learning_rate: 0.0005111704366725625
      beta: 0.000779389496363678
      epsilon: 0.23366629272546527
