behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 4992
      learning_rate: 0.0007928639966800505
      beta: 0.0025775217859720003
      epsilon: 0.2558205843600835
      lambd: 0.9455440959348589
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 64
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.9032395547755003
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 10000
