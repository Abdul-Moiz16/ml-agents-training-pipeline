behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 5120
      learning_rate: 0.0004765426640255574
      beta: 0.0004263109886247484
      epsilon: 0.2885752280827805
      lambd: 0.9432449609023758
      num_epoch: 4
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 64
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.8196608600927355
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000
