behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 3840
      learning_rate: 0.0007787864858066286
      beta: 0.00376747872576958
      epsilon: 0.2460782487999892
      lambd: 0.9419888682116077
      num_epoch: 5
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.9307546802710334
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 256
    summary_freq: 10000
