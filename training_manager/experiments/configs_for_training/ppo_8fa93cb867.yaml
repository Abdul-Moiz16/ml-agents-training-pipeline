behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.00034460748869173343
      beta: 0.003946104689406027
      epsilon: 0.29437980111384515
      lambd: 0.9408555140275321
