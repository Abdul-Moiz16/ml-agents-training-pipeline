behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 896
      learning_rate: 0.0007458483580546215
      beta: 0.008674356029178001
      epsilon: 0.19116303363161086
      lambd: 0.9197898407764884
