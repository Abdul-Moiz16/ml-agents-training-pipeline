behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 2112
      learning_rate: 4.675265403680245e-05
      beta: 0.0013337125293059748
      epsilon: 0.10114402072493336
      lambd: 0.9172769212175225
      num_epoch: 5
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 64
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.8043456010158506
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 64
    summary_freq: 10000
