behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 896
      learning_rate: 0.000610514201048362
      beta: 0.00984604934656884
      epsilon: 0.12783784826349429
      lambd: 0.9015678612754751
