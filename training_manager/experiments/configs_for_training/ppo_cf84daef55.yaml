behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 3840
      learning_rate: 0.00044059289167654647
      beta: 0.00928115101549822
      epsilon: 0.24623607279399937
      lambd: 0.9133624169455947
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 128
      num_layers: 1
