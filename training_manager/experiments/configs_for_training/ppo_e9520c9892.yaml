behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 32
      buffer_size: 1184
      learning_rate: 4.041989911400922e-05
      beta: 0.006157490314791475
      epsilon: 0.12161469324167379
      lambd: 0.9482251800452647
