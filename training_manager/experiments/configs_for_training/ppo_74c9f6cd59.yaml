behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 32
      buffer_size: 544
      learning_rate: 0.0007424178124576645
      beta: 0.0019495061353552898
      epsilon: 0.10584548493514621
      lambd: 0.9282412935224605
