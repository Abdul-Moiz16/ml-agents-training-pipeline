behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 8448
      learning_rate: 0.0004920157518276511
      beta: 0.002050762486398597
      epsilon: 0.22433804425631731
      lambd: 0.9262616821540247
