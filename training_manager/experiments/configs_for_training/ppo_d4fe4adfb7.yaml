behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 2496
      learning_rate: 0.0005491794800204818
      beta: 0.008799220044815712
      epsilon: 0.267184620159889
      lambd: 0.9138501426901701
      num_epoch: 4
