behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 2816
      learning_rate: 0.00023008925134894087
      beta: 0.001720863516477256
      epsilon: 0.1796412118430084
      lambd: 0.9103080193263635
