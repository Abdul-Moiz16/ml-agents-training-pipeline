behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 2560
      learning_rate: 0.0004988303651265096
      beta: 0.0018195394719222808
      epsilon: 0.15458707048635822
      lambd: 0.9344679481672047
