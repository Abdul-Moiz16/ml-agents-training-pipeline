behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 4480
      learning_rate: 0.0005370260501930264
      beta: 0.0025635445123951424
      epsilon: 0.1571982075423139
      lambd: 0.9007240971106638
      num_epoch: 5
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 64
      num_layers: 1
