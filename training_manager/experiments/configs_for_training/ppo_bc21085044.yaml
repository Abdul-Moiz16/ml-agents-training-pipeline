behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 0.0004876856247188732
      beta: 0.009340192179270356
      epsilon: 0.1528949279249499
      lambd: 0.9171376674443749
