behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 640
      learning_rate: 9.686026552412576e-05
      beta: 0.007706020943157897
      epsilon: 0.2535991866539615
