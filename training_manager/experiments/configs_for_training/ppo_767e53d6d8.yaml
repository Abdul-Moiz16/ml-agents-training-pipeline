behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 2368
      learning_rate: 3.8222499977004006e-05
      beta: 0.00879139707203198
      epsilon: 0.1929067998560818
      lambd: 0.9101890284701906
      num_epoch: 4
