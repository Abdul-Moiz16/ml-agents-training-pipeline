behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 128
      buffer_size: 3328
      learning_rate: 0.000332003171777094
      beta: 0.004173859956613593
      epsilon: 0.21373423465622216
