behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 2240
      learning_rate: 0.0008508999631314882
      beta: 0.007708540858480945
      epsilon: 0.2979762874416957
