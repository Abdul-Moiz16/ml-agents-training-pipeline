behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 32
      buffer_size: 896
      learning_rate: 0.000515667138745606
      beta: 0.007311432894410509
      epsilon: 0.18880450388851738
      lambd: 0.9064732204061062
