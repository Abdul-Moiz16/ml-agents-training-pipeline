behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 9216
      learning_rate: 0.00034663780656260485
      beta: 0.005750052814324922
      epsilon: 0.24361127457870532
