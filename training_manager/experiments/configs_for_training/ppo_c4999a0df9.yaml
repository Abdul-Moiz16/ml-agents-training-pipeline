behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 32
      buffer_size: 896
      learning_rate: 0.0005559393561591449
      beta: 0.0017016341908928222
      epsilon: 0.12060091441403785
      lambd: 0.946648924841335
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 256
      num_layers: 1
