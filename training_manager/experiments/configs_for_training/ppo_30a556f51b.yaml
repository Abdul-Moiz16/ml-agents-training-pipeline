behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 32
      buffer_size: 960
      learning_rate: 0.0005830226505434064
      beta: 0.009713822508092567
      epsilon: 0.23548927692434832
      lambd: 0.9442719355059842
