behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 64
      buffer_size: 960
      learning_rate: 0.0003345941270065567
      beta: 0.0015256571861113142
      epsilon: 0.215921671171041
      lambd: 0.9055688956453856
      num_epoch: 4
      learning_rate_schedule: linear

    network_settings:
      normalize: False
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.8190771649648318
        strength: 1

    keep_checkpoints: 5
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 10000
