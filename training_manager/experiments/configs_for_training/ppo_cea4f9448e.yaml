behaviors:
  3DBall:

    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 5632
      learning_rate: 0.00015856945840031562
      beta: 0.004539972391278418
      epsilon: 0.22236006557732507
      lambd: 0.9191410601827845
      num_epoch: 5
