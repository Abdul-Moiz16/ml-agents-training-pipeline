behaviors:
  3DBall:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 4224
      learning_rate: 5.9932912364014425e-05
      beta: 0.008341650073185828
      epsilon: 0.1
      lambd: 0
      num_epoch: 5
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.8
        strength: 1
    keep_checkpoints: 5
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 10000
