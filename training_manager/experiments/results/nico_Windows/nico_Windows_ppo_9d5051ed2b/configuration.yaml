behaviors:
  3DBall:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 1472
      learning_rate: 7.620864636116961e-05
      beta: 0.005415488240874194
      epsilon: 3
      lambd: 95
      num_epoch: 5
      learning_rate_schedule: linear
